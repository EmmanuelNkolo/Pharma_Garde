<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Noir Élégant -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="65%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.55"/>
    </filter>

    <!-- Cross Gradient Vert Émeraude -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Inner Cross Highlight -->
    <linearGradient id="innerLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Gradient for Name -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gold Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond Noir Élégant -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Halo d'ambiance vert émeraude -->
  <circle cx="256" cy="195" r="130" fill="#10b981" opacity="0.16"/>

  <!-- Croix Médicale en Vert Émeraude -->
  <g filter="url(#emeraldGlow)">
    <!-- Barre Horizontale -->
    <rect x="146" y="157" width="220" height="76" rx="20" ry="20" fill="url(#emeraldGrad)"/>
    <!-- Barre Verticale -->
    <rect x="218" y="85" width="76" height="220" rx="20" ry="20" fill="url(#emeraldGrad)"/>
    
    <!-- Liseré de brillance interne -->
    <rect x="150" y="161" width="212" height="68" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <rect x="222" y="89" width="68" height="212" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

    <!-- Reflet supérieur lumineux -->
    <rect x="222" y="89" width="68" height="96" rx="16" fill="url(#innerLight)"/>
  </g>

  <!-- Séparateur doré fin -->
  <circle cx="256" cy="336" r="3.5" fill="#fbbf24"/>
  <line x1="170" y1="336" x2="238" y2="336" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="274" y1="336" x2="342" y2="336" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Nom "Pharma-Garde" en Lettres d'Or -->
  <g filter="url(#goldGlow)">
    <text x="256" y="388"
          font-family="'Inter', 'Montserrat', 'Segoe UI', -apple-system, sans-serif"
          font-size="44"
          font-weight="900"
          letter-spacing="1.2"
          fill="url(#goldGrad)"
          text-anchor="middle">Pharma-Garde</text>
  </g>

  <!-- Sous-titre Santé & Proximité en Or raffiné -->
  <text x="256" y="424"
        font-family="'Inter', 'Segoe UI', -apple-system, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="4"
        fill="#fbbf24"
        opacity="0.85"
        text-anchor="middle">SANTÉ &amp; PROXIMITÉ</text>
</svg>
